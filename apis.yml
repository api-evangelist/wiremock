aid: wiremock
name: WireMock
description: >-
  WireMock is an open source tool for mocking HTTP services and APIs. It enables developers to build stable, predictable
  development environments by creating mock APIs that simulate the behavior of real services. WireMock provides a
  comprehensive admin API for managing stub mappings, recording real traffic, verifying requests, and modeling stateful
  behavior through scenarios. The project is governed by the WireMock community on GitHub and supports Java, Python,
  JavaScript, .NET, Go, PHP, and Kotlin clients.
